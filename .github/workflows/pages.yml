name: Deploy Yıldız Yarışları to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run source tests
        run: node --test tests/game.test.cjs
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html firebase.js firebase-config.js pwa.js service-worker.js manifest-student.webmanifest manifest-teacher.webmanifest manifest-teacher-test.webmanifest app-icon.svg teacher-icon.svg minecraft-test-icon.svg _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
